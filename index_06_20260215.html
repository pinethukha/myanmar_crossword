<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar Crossword Master (Fixed)</title>
    <style>
        /* CSS STYLES */
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap');

        body { font-family: 'Pyidaungsu', sans-serif; background-color: #f4f6f8; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .status-bar { text-align: center; font-size: 12px; margin-bottom: 20px; }
        .status-ok { color: green; font-weight: bold; }
        .status-err { color: red; font-weight: bold; background: #fee; padding: 5px; }

        /* INPUT SECTION */
        .config-box { border: 1px solid #ddd; padding: 20px; border-radius: 8px; background: #fff; }
        .title-input { width: 100%; padding: 10px; font-size: 18px; font-weight:bold; border: 2px solid #eee; border-radius: 6px; font-family: 'Pyidaungsu'; box-sizing: border-box; margin-bottom: 15px; }
        
        .input-list { max-height: 400px; overflow-y: auto; margin-bottom: 15px; border-top: 1px solid #eee; padding-top: 10px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; background: #f9f9f9; padding: 10px; border-radius: 6px; }
        .row-num { font-weight: bold; color: #555; width: 25px; text-align: center; }
        
        .word-in { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Pyidaungsu'; }
        .clue-in { flex: 2; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Pyidaungsu'; }
        
        .btn-del { background: #ff4d4d; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        /* BUTTONS */
        .controls { text-align: center; margin-top: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; color: white; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-add { background: #3498db; }
        .btn-gen { background: #27ae60; }
        .btn-word { background: #2980b9; display: none; } 
        .btn-ans { background: #f39c12; display: none; }

        /* OUTPUT GRID */
        #output-area { display: none; margin-top: 30px; border-top: 2px dashed #ccc; padding-top: 20px; }
        table.crossword { border-collapse: collapse; margin: 0 auto; border: 2px solid #000; }
        td.cell { 
            width: 40px; height: 40px; border: 1px solid #000; text-align: center; 
            vertical-align: middle; font-weight: bold; font-size: 18px; position: relative; 
            background: white; padding: 0;
        }
        td.blocked { 
            background-color: #e0e0e0; 
            background-image: linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%, #ccc), linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%, #ccc);
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
        }
        span.num { position: absolute; top: 1px; left: 2px; font-size: 10px; color: #444; pointer-events: none; }
        .answer-text { color: #0000aa; opacity: 0; }
        .show-answers .answer-text { opacity: 1; }

        /* CLUES */
        .clues-box { display: flex; gap: 20px; margin-top: 20px; justify-content: center; }
        .clue-col { flex: 1; border: 1px solid #ddd; padding: 15px; border-radius: 8px; background: #fff; }
        .clue-col h3 { border-bottom: 2px solid #3498db; margin-top: 0; padding-bottom: 5px; }
        ul { padding-left: 20px; }
        li { margin-bottom: 8px; }

        @media print {
            .no-print, .config-box, .controls, .status-bar { display: none !important; }
            #output-area { display: block !important; }
            body { background: white; }
            .container { box-shadow: none; border: none; margin: 0; width: 100%; max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="no-print">Myanmar Crossword Master</h1>
    <div id="status" class="status-bar no-print">Loading...</div>

    <div class="config-box no-print">
        <label>ခေါင်းစဉ်:</label>
        <input type="text" id="puzzleTitle" class="title-input" value="မြန်မာစာ ဉာဏ်စမ်းပဟေဠိ">
        
        <div id="input-list" class="input-list">
            </div>
        
        <div style="text-align: right;">
            <button class="btn btn-add" id="btnAddRow" type="button">+ စကားလုံး ထပ်ထည့်ရန်</button>
        </div>
    </div>

    <div class="controls no-print">
        <button class="btn btn-gen" id="btnGen" type="button">⚡ ဖန်တီးမည် (Generate)</button>
        <button class="btn btn-ans" id="btnAns" onclick="toggleAnswers()">👁️ အဖြေ ပြ/ဖွက်</button>
        <button class="btn btn-word" id="btnWord" onclick="exportToWord()">📄 Word (Docx) ယူမည်</button>
    </div>

    <div id="output-area">
        <h2 style="text-align:center;" id="printTitle"></h2>
        <div id="grid-wrapper"></div>
        <div class="clues-box">
            <div class="clue-col">
                <h3>အလျားလိုက် (Across)</h3>
                <ul id="clues-across"></ul>
            </div>
            <div class="clue-col">
                <h3>ဒေါင်လိုက် (Down)</h3>
                <ul id="clues-down"></ul>
            </div>
        </div>
    </div>
</div>

<script>
    // Safe script initialization
    window.onerror = function(msg, url, line) {
        document.getElementById('status').innerHTML = '<span class="status-err">Error: ' + msg + ' (Line ' + line + ')</span>';
    };

    document.addEventListener('DOMContentLoaded', function() {
        try {
            initApp();
            document.getElementById('status').innerHTML = '<span class="status-ok">System Ready (စနစ် အဆင်သင့်ဖြစ်ပါပြီ)</span>';
        } catch (e) {
            document.getElementById('status').innerHTML = '<span class="status-err">Startup Error: ' + e.message + '</span>';
        }
    });

    // --- DATA & LOGIC ---
    function initApp() {
        // Bind Buttons
        document.getElementById('btnAddRow').onclick = function() { addNewRow(); };
        document.getElementById('btnGen').onclick = function() { runGenerator(); };
        
        // Add default data
        addNewRow("မင် ဂ လာ ပါ", "မြန်မာ့ရိုးရာ နှုတ်ဆက်စကား");
        addNewRow("ကု သိုလ်", "ကောင်းမှု");
        addNewRow("နိဗ္ ဗာန်", "အငြိမ်းဓာတ်");
    }

    function addNewRow(w = '', c = '') {
        const list = document.getElementById('input-list');
        const div = document.createElement('div');
        div.className = 'input-group';
        div.innerHTML = `
            <span class="row-num"></span>
            <input type="text" class="word-in" placeholder="စကားလုံး (Space ခြားပါ)" value="${w}">
            <input type="text" class="clue-in" placeholder="အမြွက်" value="${c}">
            <button class="btn-del" onclick="this.parentElement.remove(); updateNumbers();" type="button">×</button>
        `;
        list.appendChild(div);
        updateNumbers();
    }

    function updateNumbers() {
        const rows = document.querySelectorAll('.input-group .row-num');
        rows.forEach((span, index) => { span.innerText = index + 1; });
    }

    function toggleAnswers() {
        const table = document.querySelector('table.crossword');
        if(table) table.classList.toggle('show-answers');
    }

    // --- GENERATOR ENGINE ---
    function runGenerator() {
        const title = document.getElementById('puzzleTitle').value;
        document.getElementById('printTitle').innerText = title;

        const inputs = document.querySelectorAll('.input-group');
        let words = [];
        
        inputs.forEach(div => {
            let txt = div.querySelector('.word-in').value.trim();
            let clue = div.querySelector('.clue-in').value.trim();
            if(txt && clue) {
                let parts = txt.split(/\s+/); // Split by space
                if(parts.length > 0) {
                    words.push({ original: txt, parts: parts, clue: clue, len: parts.length });
                }
            }
        });

        if(words.length === 0) {
            alert("စကားလုံးများ ထည့်ပေးပါ ဘုရား။");
            return;
        }

        // Sort longest first
        words.sort((a,b) => b.len - a.len);

        const SIZE = 50;
        let grid = Array(SIZE).fill().map(() => Array(SIZE).fill(null));
        let placed = [];

        // Place first word
        let first = words[0];
        let mid = Math.floor(SIZE/2);
        placeWord(grid, first, mid, mid - Math.floor(first.len/2), 'across');
        placed.push({...first, r: mid, c: mid - Math.floor(first.len/2), dir: 'across'});

        // Try to place others
        for(let i=1; i<words.length; i++) {
            let current = words[i];
            let bestMove = null;

            // Find intersection
            for(let pWord of placed) {
                for(let cIdx=0; cIdx<current.len; cIdx++) {
                    for(let pIdx=0; pIdx<pWord.len; pIdx++) {
                        if(current.parts[cIdx] === pWord.parts[pIdx]) {
                            // Possible cross
                            let newDir = (pWord.dir === 'across') ? 'down' : 'across';
                            let newR = (pWord.dir === 'across') ? pWord.r - cIdx : pWord.r + pIdx;
                            let newC = (pWord.dir === 'across') ? pWord.c + pIdx : pWord.c - cIdx;

                            if(canPlace(grid, current, newR, newC, newDir)) {
                                bestMove = { r: newR, c: newC, dir: newDir };
                                break; 
                            }
                        }
                    }
                    if(bestMove) break;
                }
                if(bestMove) break;
            }

            if(bestMove) {
                placeWord(grid, current, bestMove.r, bestMove.c, bestMove.dir);
                placed.push({...current, ...bestMove});
            } else {
                // Island placement (Force Add)
                let bounds = getBounds(grid);
                let forceR = bounds.maxR + 2;
                placeWord(grid, current, forceR, bounds.minC, 'across');
                placed.push({...current, r: forceR, c: bounds.minC, dir: 'across'});
            }
        }

        renderGrid(grid, placed);
    }

    function canPlace(grid, word, r, c, dir) {
        if(r<0 || c<0 || r>=50 || c>=50) return false;
        if(dir === 'across' && c + word.len >= 50) return false;
        if(dir === 'down' && r + word.len >= 50) return false;

        for(let i=0; i<word.len; i++) {
            let cr = (dir==='across') ? r : r+i;
            let cc = (dir==='across') ? c+i : c;
            let cell = grid[cr][cc];

            if(cell !== null && cell !== word.parts[i]) return false;

            // Neighbor check for empty cells
            if(cell === null) {
                if(dir === 'across') {
                    if(grid[cr-1] && grid[cr-1][cc]) return false;
                    if(grid[cr+1] && grid[cr+1][cc]) return false;
                    if(i===0 && grid[cr][cc-1]) return false;
                    if(i===word.len-1 && grid[cr][cc+1]) return false;
                } else {
                    if(grid[cr][cc-1]) return false;
                    if(grid[cr][cc+1]) return false;
                    if(i===0 && grid[cr-1] && grid[cr-1][cc]) return false;
                    if(i===word.len-1 && grid[cr+1] && grid[cr+1][cc]) return false;
                }
            }
        }
        return true;
    }

    function placeWord(grid, word, r, c, dir) {
        for(let i=0; i<word.len; i++) {
            let cr = (dir==='across
