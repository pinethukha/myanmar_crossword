<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar Crossword Pro (Final)</title>
    
    <script>
        window.onerror = function(msg, url, line) {
            var el = document.getElementById('status');
            if(el) {
                el.innerHTML = "<span style='color:red; background:#fee; padding:5px;'>Error: " + msg + " (Line " + line + ")</span>";
            }
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap');

        body { font-family: 'Pyidaungsu', sans-serif; background-color: #f3f4f6; padding: 20px; color: #1f2937; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        h1 { text-align: center; color: #1e40af; margin-bottom: 5px; }
        .status-bar { text-align: center; font-size: 13px; margin-bottom: 20px; font-weight: bold; color: #10b981; min-height: 20px; }

        /* INPUT SECTION - NO SCROLLBAR CONSTRAINT */
        .config-box { border: 1px solid #e5e7eb; padding: 25px; border-radius: 8px; background: #fff; }
        .title-input { width: 100%; padding: 12px; font-size: 18px; font-weight: bold; border: 2px solid #e5e7eb; border-radius: 6px; font-family: 'Pyidaungsu'; box-sizing: border-box; margin-bottom: 20px; transition: 0.2s; }
        .title-input:focus { border-color: #3b82f6; outline: none; }
        
        /* The list expands naturally - NO MAX HEIGHT */
        .input-list { margin-bottom: 15px; } 
        
        .input-group { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; background: #f9fafb; padding: 10px; border-radius: 8px; border: 1px solid #f3f4f6; transition: 0.2s; }
        .input-group:focus-within { border-color: #93c5fd; background: #eff6ff; }
        
        .row-num { font-weight: bold; color: #6b7280; width: 30px; text-align: center; font-size: 14px; }
        
        .word-in, .clue-in { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-family: 'Pyidaungsu'; font-size: 16px; outline: none; transition: 0.2s; }
        .clue-in { flex: 2; }
        .word-in:focus, .clue-in:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        
        .btn-del { background: #ef4444; color: white; border: none; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: 0.2s; }
        .btn-del:hover { background: #dc2626; }

        /* CONTROLS */
        .controls { text-align: center; margin-top: 25px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; padding-top: 20px; border-top: 2px dashed #e5e7eb; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; color: white; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn:hover { transform: translateY(-2px); shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-add { background: #3b82f6; } /* Blue */
        .btn-gen { background: #10b981; } /* Green */
        .btn-word { background: #6366f1; display: none; } /* Indigo */
        .btn-ans { background: #f59e0b; display: none; } /* Amber */

        /* OUTPUT GRID */
        #output-area { display: none; margin-top: 40px; }
        table.crossword { border-collapse: collapse; margin: 0 auto; border: 2px solid #111; }
        td.cell { 
            width: 45px; height: 45px; border: 1px solid #111; text-align: center; 
            vertical-align: middle; font-weight: bold; font-size: 18px; position: relative; 
            background: white; padding: 0; cursor: default;
        }
        /* Stylish Diagonal Line for Blocked Cells */
        td.blocked { 
            background-color: #f3f4f6;
            background-image: linear-gradient(45deg, #ddd 25%, transparent 25%, transparent 75%, #ddd 75%, #ddd), 
                              linear-gradient(45deg, #ddd 25%, transparent 25%, transparent 75%, #ddd 75%, #ddd);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        
        span.num { position: absolute; top: 2px; left: 3px; font-size: 11px; color: #444; font-weight: normal; pointer-events: none; }
        .answer-text { color: #1d4ed8; visibility: hidden; }
        .show-answers .answer-text { visibility: visible; }

        /* CLUES LAYOUT */
        .clues-box { display: flex; gap: 30px; margin-top: 30px; }
        .clue-col { flex: 1; border: 1px solid #e5e7eb; padding: 20px; border-radius: 8px; background: #fff; }
        .clue-col h3 { border-bottom: 2px solid #3b82f6; margin-top: 0; padding-bottom: 8px; color: #1e3a8a; }
        ul { padding-left: 20px; margin: 0; }
        li { margin-bottom: 10px; line-height: 1.5; }
        li b { color: #1d4ed8; margin-right: 5px; }

        @media print {
            .no-print, .config-box, .controls, .status-bar { display: none !important; }
            #output-area { display: block !important; margin-top: 0; }
            .container { box-shadow: none; border: none; margin: 0; width: 100%; max-width: 100%; padding: 0; }
            .clues-box { display: flex !important; } /* Force flex in print */
            body { background: white; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="no-print">Myanmar Crossword Master</h1>
    <div id="status" class="status-bar no-print">Initializing...</div>

    <div class="config-box no-print">
        <label style="font-weight:bold; display:block; margin-bottom:8px;">ခေါင်းစဉ် (Puzzle Title):</label>
        <input type="text" id="puzzleTitle" class="title-input" value="မြန်မာစာ ဉာဏ်စမ်းပဟေဠိ">
        
        <div id="input-list" class="input-list">
            </div>
        
        <div style="text-align: right;">
            <button class="btn btn-add" id="btnAdd" type="button">+ စကားလုံး ထပ်ထည့်ရန်</button>
        </div>
    </div>

    <div class="controls no-print">
        <button class="btn btn-gen" id="btnGen" type="button">⚡ ဖန်တီးမည် (Generate)</button>
        <button class="btn btn-ans" id="btnAns" type="button">👁️ အဖြေ ပြ/ဖွက်</button>
        <button class="btn btn-word" id="btnWord" type="button">📄 Word (Docx) ယူမည်</button>
    </div>

    <div id="output-area">
        <h2 style="text-align:center; margin-bottom:20px;" id="printTitle"></h2>
        <div id="grid-wrapper"></div>
        
        <div class="clues-box">
            <div class="clue-col">
                <h3>အလျားလိုက် (Across)</h3>
                <ul id="clues-across"></ul>
            </div>
            <div class="clue-col">
                <h3>ဒေါင်လိုက် (Down)</h3>
                <ul id="clues-down"></ul>
            </div>
        </div>
    </div>
</div>

<script>
    // --- 1. CORE & UI LOGIC ---

    function getEl(id) { return document.getElementById(id); }

    function addNewRow(w, c, focusWord) {
        w = w || "";
        c = c || "";
        var list = getEl('input-list');
        var div = document.createElement('div');
        div.className = 'input-group';
        
        // Setup Inputs
        var spanNum = document.createElement('span');
        spanNum.className = 'row-num';
        
        var inputWord = document.createElement('input');
        inputWord.type = 'text';
        inputWord.className = 'word-in';
        inputWord.placeholder = 'စကားလုံး (Space ခြားပါ)';
        inputWord.value = w;
        
        var inputClue = document.createElement('input');
        inputClue.type = 'text';
        inputClue.className = 'clue-in';
        inputClue.placeholder = 'အမြွက်';
        inputClue.value = c;
        
        // TAB KEY LOGIC (The Magic Feature)
        inputClue.addEventListener('keydown', function(e) {
            if(e.key === 'Tab' && !e.shiftKey) {
                e.preventDefault(); // Stop creating a normal tab
                addNewRow('', '', true); // Create new row and focus it
            }
        });

        var btnDel = document.createElement('button');
        btnDel.className = 'btn-del';
        btnDel.innerHTML = '×';
        btnDel.type = 'button';
        btnDel.onclick = function() {
            div.remove();
            updateNumbers();
        };

        div.appendChild(spanNum);
        div.appendChild(inputWord);
        div.appendChild(inputClue);
        div.appendChild(btnDel);
        
        list.appendChild(div);
        updateNumbers();

        if(focusWord) {
            inputWord.focus();
        }
    }

    function updateNumbers() {
        var rows = document.querySelectorAll('.input-group .row-num');
        for(var i=0; i<rows.length; i++) {
            rows[i].innerText = (i + 1);
        }
    }

    // --- 2. BALANCED GENERATOR ALGORITHM ---
    
    function runGenerator() {
        var title = getEl('puzzleTitle').value;
        getEl('printTitle').innerText = title;

        var inputs = document.querySelectorAll('.input-group');
        var words = [];
        
        for(var i=0; i<inputs.length; i++) {
            var wIn = inputs[i].querySelector('.word-in').value.trim();
            var cIn = inputs[i].querySelector('.clue-in').value.trim();
            if(wIn && cIn) {
                var parts = wIn.split(/\s+/);
                if(parts.length > 0) words.push({ original: wIn, parts: parts, clue: cIn, len: parts.length });
            }
        }

        if(words.length === 0) return alert("စကားလုံးများ ထည့်ပေးပါ ဘုရား။");

        // Sort longest first
        words.sort(function(a,b) { return b.len - a.len; });

        // Grid Size
        var SIZE = 50;
        var grid = [];
        for(var r=0; r<SIZE; r++) {
            var row = [];
            for(var c=0; c<SIZE; c++) row.push(null);
            grid.push(row);
        }

        var placed = [];
        
        // Place First Word (Force Center)
        var first = words[0];
        var mid = Math.floor(SIZE/2);
        // Start Across to set a base
        placeWord(grid, first, mid, mid - Math.floor(first.len/2), 'across');
        placed.push(createPlacedObj(first, mid, mid - Math.floor(first.len/2), 'across'));

        // Place Remaining
        for(var i=1; i<words.length; i++) {
            var current = words[i];
            var candidates = [];

            // Find ALL possible intersections
            for(var p=0; p<placed.length; p++) {
                var pWord = placed[p];
                
                for(var cIdx=0; cIdx<current.len; cIdx++) {
                    for(var pIdx=0; pIdx<pWord.len; pIdx++) {
                        if(current.parts[cIdx] === pWord.parts[pIdx]) {
                            // Valid intersection letter found
                            var newDir = (pWord.dir === 'across') ? 'down' : 'across';
                            var newR = (pWord.dir === 'across') ? pWord.r - cIdx : pWord.r + pIdx;
                            var newC = (pWord.dir === 'across') ? pWord.c + pIdx : pWord.c - cIdx;

                            if(canPlace(grid, current, newR, newC, newDir)) {
                                candidates.push({r: newR, c: newC, dir: newDir});
                            }
                        }
                    }
                }
            }

            // SMART SELECTION (Balancing Logic)
            if(candidates.length > 0) {
                // Count current Balance
                var countAcross = 0, countDown = 0;
                for(var k=0; k<placed.length; k++) {
                    if(placed[k].dir === 'across') countAcross++; else countDown++;
                }

                // Score candidates: Prioritize the direction we lack
                // If we have more Across, we WANT Down.
                var bestCandidate = null;
                var bestScore = -9999;

                for(var k=0; k<candidates.length; k++) {
                    var cand = candidates[k];
                    var score = 0;

                    // Balance Bonus
                    if(cand.dir === 'down' && countAcross > countDown) score += 20;
                    else if(cand.dir === 'across' && countDown > countAcross) score += 20;

                    // Compactness Bonus (Distance from center)
                    var dist = Math.abs(cand.r - mid) + Math.abs(cand.c - mid);
                    score -= dist; // Closer to center is better

                    if(score > bestScore) {
                        bestScore = score;
                        bestCandidate = cand;
                    }
                }

                placeWord(grid, current, bestCandidate.r, bestCandidate.c, bestCandidate.dir);
                placed.push(createPlacedObj(current, bestCandidate.r, bestCandidate.c, bestCandidate.dir));

            } else {
                // Island Placement (If no intersection found)
                var bounds = getBounds(grid);
                var forceR = bounds.maxR + 2;
                // Force Island to be 'Across' if we have too many 'Downs', else 'Down' (if possible), or just default Across
                placeWord(grid, current, forceR, bounds.minC, 'across');
                placed.push(createPlacedObj(current, forceR, bounds.minC, 'across'));
            }
        }

        renderGrid(grid, placed);
    }

    // --- HELPER FUNCTIONS ---

    function createPlacedObj(word, r, c, dir) {
        return { original: word.original, clue: word.clue, len: word.len, parts: word.parts, r: r, c: c, dir: dir };
    }

    function canPlace(grid, word, r, c, dir) {
        if(r<0 || c<0 || r>=50 || c>=50) return false;
        if(dir === 'across' && c + word.len >= 50) return false;
        if(dir === 'down' && r + word.len >= 50) return false;

        for(var i=0; i<word.len; i++) {
            var cr = (dir==='across') ? r : r+i;
            var cc = (dir==='across') ? c+i : c;
            var cell = grid[cr][cc];

            if(cell !== null && cell !== word.parts[i]) return false;

            if(cell === null) {
                // Check neighbors
                if(dir === 'across') {
                    if(grid[cr-1] && grid[cr-1][cc]) return false;
                    if(grid[cr+1] && grid[cr+1][cc]) return false;
                    if(i===0 && grid[cr][cc-1]) return false;
                    if(i===word.len-1 && grid[cr][cc+1]) return false;
                } else {
                    if(grid[cr][cc-1]) return false;
                    if(grid[cr][cc+1]) return false;
                    if(i===0 && grid[cr-1] && grid[cr-1][cc]) return false;
                    if(i===word.len-1 && grid[cr+1] && grid[cr+1][cc]) return false;
                }
            }
        }
        return true;
    }

    function placeWord(grid, word, r, c, dir) {
        for(var i=0; i<word.len; i++) {
            var cr = (dir==='across') ? r : r+i;
            var cc = (dir==='across') ? c+i : c;
            grid[cr][cc] = word.parts[i];
        }
    }

    function getBounds(grid) {
        var minR=50, maxR=0, minC=50, maxC=0, empty=true;
        for(var r=0; r<50; r++) {
            for(var c=0; c<50; c++) {
                if(grid[r][c]) {
                    empty = false;
                    if(r<minR)minR=r; if(r>maxR)maxR=r;
                    if(c<minC)minC=c; if(c>maxC)maxC=c;
                }
            }
        }
        return empty ? {minR:0,maxR:0,minC:0,maxC:0} : {minR:minR,maxR:maxR,minC:minC,maxC:maxC};
    }

    function renderGrid(grid, placed) {
        var bounds = getBounds(grid);
        var numMap = {};
        var counter = 1;
        
        placed.sort(function(a,b){ return (a.r - b.r) || (a.c - b.c); });
        
        var cluesA = [], cluesD = [];
        for(var i=0; i<placed.length; i++) {
            var w = placed[i];
            var key = w.r + ',' + w.c;
            if(!numMap[key]) numMap[key] = counter++;
            var n = numMap[key];
            if(w.dir === 'across') cluesA.push({n:n, t:w.clue});
            else cluesD.push({n:n, t:w.clue});
        }

        var html = '<table class="crossword">';
        for(var r=bounds.minR; r<=bounds.maxR; r++) {
            html += '<tr>';
            for(var c=bounds.minC; c<=bounds.maxC; c++) {
                var cell = grid[r][c];
                if(cell) {
                    var num = numMap[r+','+c] || '';
                    html += '<td class="cell"><span class="num">'+num+'</span><span class="answer-text">'+cell+'</span></td>';
                } else {
                    html += '<td class="blocked"></td>';
                }
            }
            html += '</tr>';
        }
        html += '</table>';

        getEl('grid-wrapper').innerHTML = html;
        
        var renderList = function(id, list) {
            var ul = getEl(id);
            ul.innerHTML = '';
            list.sort(function(a,b){return a.n - b.n}).forEach(function(x){
                ul.innerHTML += '<li><b>'+x.n+'.</b> '+x.t+'</li>';
            });
        };
        renderList('clues-across', cluesA);
        renderList('clues-down', cluesD);

        getEl('output-area').style.display = 'block';
        getEl('btnWord').style.display = 'inline-block';
        getEl('btnAns').style.display = 'inline-block';
    }

    // --- WORD EXPORT ---
    function exportToWord() {
        var title = getEl('puzzleTitle').value;
        var gridHtml = getEl('grid-wrapper').innerHTML;
        var cluesA = getEl('clues-across').innerHTML;
        var cluesD = getEl('clues-down').innerHTML;
        var safeGrid = gridHtml.replace(/class="blocked"/g, 'style="background-color:#eee;"');
        
        var content = 
            "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'>" +
            "<head><meta charset='utf-8'><title>"+title+"</title></head>" +
            "<body style='font-family: \"Pyidaungsu\", sans-serif;'>" +
            "<h1 style='text-align:center'>"+title+"</h1><br>" +
            safeGrid +
            "<br><table width='100%' style='margin-top:20px;'><tr>" +
            "<td valign='top' width='50%'><h3>အလျားလိုက်</h3><ul>"+cluesA+"</ul></td>" +
            "<td valign='top' width='50%'><h3>ဒေါင်လိုက်</h3><ul>"+cluesD+"</ul></td>" +
            "</tr></table></body></html>";

        var blob = new Blob(['\ufeff', content], {type: 'application/msword'});
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = title + '.doc';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // --- INIT ---
    getEl('btnAdd').onclick = function() { addNewRow(); };
    getEl('btnGen').onclick = function() { runGenerator(); };
    getEl('btnAns').onclick = function() { 
        var t = document.querySelector('table.crossword');
        if(t) t.classList.toggle('show-answers');
    };
    getEl('btnWord').onclick = function() { exportToWord(); };

    // Start
    addNewRow("မင် ဂ လာ ပါ", "နှုတ်ဆက်စကား");
    addNewRow("ကု သိုလ်", "ကောင်းမှု");
    getEl('status').innerHTML = "Ready";

</script>
</body>
</html>
