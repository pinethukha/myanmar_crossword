<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar Crossword Maker</title>
    <style>
        body { font-family: "Pyidaungsu", sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        h1 { color: #333; }
        .controls { margin-bottom: 20px; }
        .grid-container { display: grid; gap: 2px; margin: 0 auto; background-color: #333; border: 2px solid #333; width: fit-content; }
        .cell {
            width: 40px; height: 40px; background-color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; position: relative;
        }
        .cell input {
            width: 100%; height: 100%; border: none; text-align: center;
            font-family: "Pyidaungsu", sans-serif; font-size: 16px; outline: none; background: transparent;
        }
        .cell.black { background-color: black; }
        .cell.black input { display: none; }
        .clue-number {
            position: absolute; top: 1px; left: 1px; font-size: 10px; color: #333; pointer-events: none;
        }
        .btn { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 5px; margin: 5px; }
        .btn-print { background-color: #008CBA; }
        @media print {
            .controls, h1 { display: none; }
            .grid-container { border: 2px solid black; }
            .cell { border: 1px solid black; }
        }
    </style>
</head>
<body>

    <h1>မြန်မာ Crossword ဖန်တီးစက်</h1>

    <div class="controls">
        <label>အကွက်အရေအတွက် (Rows/Cols): </label>
        <input type="number" id="gridSize" value="10" min="5" max="20" style="width: 50px;">
        <button class="btn" onclick="createGrid()">ဇယားကွက်သစ်ဆွဲမည်</button>
        <br><br>
        <button class="btn btn-print" onclick="window.print()">Print ထုတ်မည် (PDF)</button>
        <p style="font-size: 14px; color: #666;">(အကွက်ကို နှိပ်ပါက "အမည်းကွက်" ပြောင်းပါမည်။ စာရိုက်ထည့်နိုင်ပါသည်။)</p>
    </div>

    <div id="crossword" class="grid-container"></div>

    <script>
        function createGrid() {
            const size = document.getElementById('gridSize').value;
            const container = document.getElementById('crossword');
            container.style.gridTemplateColumns = `repeat(${size}, 40px)`;
            container.innerHTML = '';

            for (let i = 0; i < size * size; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                
                // Toggle Black/White on Click (if not typing)
                cell.onclick = function(e) {
                    if (e.target.tagName !== 'INPUT') {
                        this.classList.toggle('black');
                        if (!this.classList.contains('black')) {
                            let input = this.querySelector('input');
                            if (!input) {
                                input = document.createElement('input');
                                input.maxLength = 1; 
                                this.appendChild(input);
                            }
                            input.focus();
                        } else {
                            this.innerHTML = ''; // Clear content if black
                        }
                    }
                };

                let input = document.createElement('input');
                input.maxLength = 1; // Limit to 1 character visually
                cell.appendChild(input);

                container.appendChild(cell);
            }
        }
        // Initialize with default size
        createGrid();
    </script>
</body>
</html>
